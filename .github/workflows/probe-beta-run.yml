name: Probe active beta pipeline

on:
  push:
    branches:
      - Flutter
    paths:
      - '.github/workflows/probe-beta-run.yml'

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Record active beta pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch Flutter --event workflow_dispatch --limit 1 --json databaseId,url,status,conclusion,headSha,createdAt,updatedAt)"
          CONTENT="$(printf '%s\n' "$RUN" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.github/beta-probe.json" \
            -f message='Record active beta pipeline probe' \
            -f content="$CONTENT" \
            -f branch='Flutter' >/dev/null
