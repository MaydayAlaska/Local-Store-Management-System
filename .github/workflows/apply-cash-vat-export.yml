          )

          cash = replace_once(
              cash,
              """              const SizedBox(width: 16),
              Expanded(
                child: Card(
""",
              """              const SizedBox(width: 16),
              SizedBox(
                width: 500,
                child: Card(
""",
              'Larghezza pannello destro cassa',
          )

          cash = replace_once(
              cash,
              """    final count = _cart.fold<int>(0, (sum, line) => sum + line.quantity);

    return HidBarcodeListener(
""",
