          )
          model = replace_once(
              model,
              """        'CurrencyCode': currencyCode,
        'ThemeMode': themeMode,
""",
              """        'CurrencyCode': currencyCode,
        'VatPercent': vatPercent,
        'ThemeMode': themeMode,
""",
