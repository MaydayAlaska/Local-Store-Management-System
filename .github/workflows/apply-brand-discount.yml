name: Apply brand discount automation

on:
  push:
    branches:
      - Flutter
    paths:
      - .github/brand-discount-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Flutter
        uses: actions/checkout@v7
        with:
          ref: Flutter
          fetch-depth: 0

      - name: Prepare patch helper
        shell: bash
        run: |
          cp tool/apply_brand_discount.py "$RUNNER_TEMP/apply_brand_discount.py"
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path(__import__('os').environ['RUNNER_TEMP']) / 'apply_brand_discount.py'
          text = path.read_text()

          constructor_pattern = re.compile(
              r"text = replace_once\(\n    text,\n    \"\"\"    this\.purchasePriceCents,.*?    'ProductSummary constructor',\n\)\n",
              re.S,
          )
          constructor_replacement = '''summary_start = text.index('class ProductSummary {')
          summary_end = text.index('class ProductDraft {', summary_start)
          summary = text[summary_start:summary_end]
          summary = replace_once(
              summary,
              """    this.purchasePriceCents,\n    this.salePriceCents,\n    this.notes,""",
              """    this.purchasePriceCents,\n    this.purchasePriceIsManual = false,\n    this.salePriceCents,\n    this.notes,""",
              'ProductSummary constructor',
          )
          text = text[:summary_start] + summary + text[summary_end:]
          '''
          text, count = constructor_pattern.subn(constructor_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Unable to patch ProductSummary constructor helper: {count}')

          fields_pattern = re.compile(
              r"text = replace_once\(\n    text,\n    \"\"\"  final int\? purchasePriceCents;.*?    'ProductSummary fields',\n\)\n",
              re.S,
          )
          fields_replacement = '''summary_start = text.index('class ProductSummary {')
          summary_end = text.index('class ProductDraft {', summary_start)
          summary = text[summary_start:summary_end]
          summary = replace_once(
              summary,
              """  final int? purchasePriceCents;\n  final int? salePriceCents;\n  final String? notes;""",
              """  final int? purchasePriceCents;\n  final bool purchasePriceIsManual;\n  final int? salePriceCents;\n  final String? notes;""",
              'ProductSummary fields',
          )
          text = text[:summary_start] + summary + text[summary_end:]
          '''
          text, count = fields_pattern.subn(fields_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Unable to patch ProductSummary fields helper: {count}')
          path.write_text(text)
          PY

      - name: Apply source changes
        run: python3 "$RUNNER_TEMP/apply_brand_discount.py"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add automatic brand purchase discounts'
          git push origin HEAD:Flutter
