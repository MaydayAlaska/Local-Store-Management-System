          rm -f test/widget_test.dart

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lib/models/customer.dart lib/repositories/customer_repository.dart lib/pages/cash_page.dart lib/pages/gift_card_purchase_dialog.dart lib/pages/gift_card_editor_dialog.dart lib/pages/gift_cards_page.dart test/customer_repository_test.dart test/gift_card_cleanup_test.dart
          git diff --cached --check
