name: Publish beta 0.2.1-b1 once

on:
  push:
    branches:
      - Flutter
    paths:
      - '.github/workflows/publish-beta-once.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download successful build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf downloaded dist
          mkdir -p downloaded dist
          gh run download 32597791240 --repo "$GITHUB_REPOSITORY" --pattern 'package-*' --dir downloaded
          find downloaded -type f -maxdepth 3 -print
          find downloaded -type f -exec cp '{}' dist/ \;
          test -f dist/LocalStoreManagement-Setup-win-x64.exe
          test -f dist/LocalStoreManagement-Setup-win-arm64.exe
          test -f dist/LocalStoreManagement-macos-x64.dmg
          test -f dist/LocalStoreManagement-macos-arm64.dmg
          test -f dist/LocalStoreManagement-linux-x64.AppImage
          test -f dist/LocalStoreManagement-linux-x64.deb
          test -f dist/LocalStoreManagement-linux-arm64.AppImage
          test -f dist/LocalStoreManagement-linux-arm64.deb

      - name: Publish beta prerelease
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='0.2.1-b1'
          TAG='beta-latest'
          mv dist/LocalStoreManagement-Setup-win-x64.exe "dist/LocalStoreManagement-${VERSION}-BETA-Setup-win-x64.exe"
          mv dist/LocalStoreManagement-Setup-win-arm64.exe "dist/LocalStoreManagement-${VERSION}-BETA-Setup-win-arm64.exe"
          mv dist/LocalStoreManagement-macos-x64.dmg "dist/LocalStoreManagement-${VERSION}-BETA-macos-x64.dmg"
          mv dist/LocalStoreManagement-macos-arm64.dmg "dist/LocalStoreManagement-${VERSION}-BETA-macos-arm64.dmg"
          mv dist/LocalStoreManagement-linux-x64.AppImage "dist/LocalStoreManagement-${VERSION}-BETA-linux-x64.AppImage"
          mv dist/LocalStoreManagement-linux-x64.deb "dist/LocalStoreManagement-${VERSION}-BETA-linux-x64.deb"
          mv dist/LocalStoreManagement-linux-arm64.AppImage "dist/LocalStoreManagement-${VERSION}-BETA-linux-arm64.AppImage"
          mv dist/LocalStoreManagement-linux-arm64.deb "dist/LocalStoreManagement-${VERSION}-BETA-linux-arm64.deb"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target '0d87c0eccadf9391a7c3456e3d0190732d7f379f' --prerelease --latest=false \
            --title 'Local Store Management v0.2.1-b1 BETA' \
            --notes 'Versione BETA 0.2.1-b1 generata dal branch Flutter. Include Windows x64/ARM64, macOS Intel/Apple Silicon in formato DMG e Linux x64/ARM64 in formato AppImage e DEB.'

      - name: Record publication result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PUBLISH_OUTCOME" = 'success' ]; then
            RELEASE_JSON="$(gh release view beta-latest --repo "$GITHUB_REPOSITORY" --json url,tagName,name,isPrerelease,createdAt,publishedAt,targetCommitish)"
            STATUS='success'
          else
            RELEASE_JSON='{}'
            STATUS='failure'
          fi
          printf '{"status":"%s","release":%s}\n' "$STATUS" "$RELEASE_JSON" > result.json
          CONTENT="$(base64 -w0 result.json)"
          EXISTING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/beta-publish-0.2.1-b1.json?ref=Flutter" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.github/beta-publish-0.2.1-b1.json" \
              -f message='Update beta 0.2.1-b1 publication result' -f content="$CONTENT" -f branch='Flutter' -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.github/beta-publish-0.2.1-b1.json" \
              -f message='Record beta 0.2.1-b1 publication result' -f content="$CONTENT" -f branch='Flutter' >/dev/null
          fi
          test "$PUBLISH_OUTCOME" = 'success'
