"""
          cash = replace_once(cash, keypad_title, '', 'Titolo tastierino')
          cash_path.write_text(cash)

          # --- Impostazioni: VAT globale persistente.
          settings_model_path = Path('lib/models/app_settings.dart')
          model = settings_model_path.read_text()
          model = replace_once(
              model,
              """    this.currencyCode = 'EUR',
    this.themeMode = 'system',
""",
              """    this.currencyCode = 'EUR',
    this.vatPercent = 22,
    this.themeMode = 'system',
""",
              'Costruttore AppSettings VAT',
          )
          model = replace_once(
              model,
              """  final String currencyCode;
  final String themeMode;
""",
              """  final String currencyCode;
  final double vatPercent;
  final String themeMode;
""",
