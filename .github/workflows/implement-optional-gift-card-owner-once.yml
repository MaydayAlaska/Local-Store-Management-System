              '''  List<GiftCard> giftCards([int limit = 5000]) {
    final rows = database.db.select('''
      SELECT * FROM gift_cards
      ORDER BY created_at_utc DESC, id DESC
      LIMIT ?;
    ''', [limit.clamp(1, 10000)]);
    return rows.map(_giftCardFromRow).toList();
