          )
          model = replace_once(
              model,
              """    final currency = (json['CurrencyCode'] as String?)?.trim().toUpperCase();
    final theme = (json['ThemeMode'] as String?)?.trim().toLowerCase();
""",
              """    final currency = (json['CurrencyCode'] as String?)?.trim().toUpperCase();
