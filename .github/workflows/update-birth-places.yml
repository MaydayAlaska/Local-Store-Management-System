name: Update ANPR birth place dataset

on:
  push:
    branches: [Flutter]
    paths:
      - tool/update_birth_places.py
      - .github/workflows/update-birth-places.yml
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Refresh official ANPR dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Flutter
        uses: actions/checkout@v7
        with:
          ref: Flutter
          fetch-depth: 0

      - name: Generate and validate dataset
        run: python3 tool/update_birth_places.py

      - name: Ensure every build verifies ANPR freshness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build.yml')
          text = path.read_text(encoding='utf-8')
          marker = '      - name: Verify embedded ANPR dataset is current\n'
          if marker in text:
              raise SystemExit(0)

          needle = '      - name: Setup Flutter\n'
          if needle not in text:
              raise SystemExit('Impossibile trovare il punto di inserimento nel job verify.')

          step = '''      - name: Verify embedded ANPR dataset is current
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/update_birth_places.py
          if ! git diff --quiet -- assets/data/birth_places.json assets/data/birth_places_manifest.json; then
            echo "::error::Il dataset ANPR incorporato non coincide con la fonte ufficiale corrente."
            git diff --stat -- assets/data/birth_places.json assets/data/birth_places_manifest.json
            exit 1
          fi

'''
          path.write_text(text.replace(needle, step + needle, 1), encoding='utf-8')
          PY

      - name: Commit only when ANPR data or guard changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/data/birth_places.json assets/data/birth_places_manifest.json .github/workflows/build.yml; then
            echo "Archivio ANPR e controllo build invariati."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/birth_places.json assets/data/birth_places_manifest.json .github/workflows/build.yml
          git commit -m "ci: refresh ANPR data and build guard"
          git pull --rebase origin Flutter
          git push origin HEAD:Flutter
