name: Apply cash keypad layout and bump beta

on:
  push:
    branches: [Flutter]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[layout-bump]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest Flutter branch
        uses: actions/checkout@v7
        with:
          ref: Flutter
          fetch-depth: 0

      - name: Fast-forward to latest branch state
        shell: bash
        run: git pull --ff-only origin Flutter

      - name: Move keypad under total and bump beta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          cash_path = Path('lib/pages/cash_page.dart')
          cash = cash_path.read_text()

          old_left = """                    const SizedBox(height: 8),
                    Expanded(
                      child: LayoutBuilder(
                        builder: (context, constraints) {
                          final keypadWidth = constraints.maxWidth > 500
                              ? 500.0
                              : constraints.maxWidth;
                          final keypadHeight = constraints.maxHeight > 460
                              ? 460.0
                              : constraints.maxHeight;
                          return Align(
                            alignment: Alignment.topCenter,
                            child: SizedBox(
                              width: keypadWidth,
                              height: keypadHeight,
                              child: _CashKeypad(
                                priceText: formatMoney(_keypadPriceCents),
                                onKey: _keypadInsert,
                                onBackspace: _keypadBackspace,
                                onClear: _keypadClear,
                                onSubmit: _keypadSubmit,
                              ),
                            ),
                          );
                        },
                      ),
                    ),
"""
          if cash.count(old_left) != 1:
              raise SystemExit('Blocco tastierino sinistro non trovato in modo univoco; nessuna modifica applicata.')
          cash = cash.replace(old_left, '', 1)

          total_marker = """                          Row(children: [
                            Expanded(
                              child: Text(
                                AppStrings.t('total'),
                                style: Theme.of(context).textTheme.titleLarge,
                              ),
                            ),
                            Text(
                              formatMoney(_finalTotalCents),
                              style: Theme.of(context).textTheme.headlineMedium,
                            ),
                          ]),
                          const SizedBox(height: 8),
                          Text(
"""
          total_with_keypad = """                          Row(children: [
                            Expanded(
                              child: Text(
                                AppStrings.t('total'),
                                style: Theme.of(context).textTheme.titleLarge,
                              ),
                            ),
                            Text(
                              formatMoney(_finalTotalCents),
                              style: Theme.of(context).textTheme.headlineMedium,
                            ),
                          ]),
                          const SizedBox(height: 12),
                          Align(
                            alignment: Alignment.center,
                            child: SizedBox(
                              width: 500,
                              height: (MediaQuery.sizeOf(context).height * 0.32)
                                  .clamp(300.0, 460.0)
                                  .toDouble(),
                              child: _CashKeypad(
                                priceText: formatMoney(_keypadPriceCents),
                                onKey: _keypadInsert,
                                onBackspace: _keypadBackspace,
                                onClear: _keypadClear,
                                onSubmit: _keypadSubmit,
                              ),
                            ),
                          ),
                          const SizedBox(height: 8),
                          Text(
"""
          if cash.count(total_marker) != 1:
              raise SystemExit('Blocco Totale non trovato in modo univoco; nessuna modifica applicata.')
          cash = cash.replace(total_marker, total_with_keypad, 1)
          cash_path.write_text(cash)

          pubspec_path = Path('pubspec.yaml')
          pubspec = pubspec_path.read_text()
          match = re.search(r'(?m)^version:\s*(\d+\.\d+\.\d+)-b(\d+)\s*$', pubspec)
          if match is None:
              raise SystemExit('Versione beta non trovata in pubspec.yaml.')
          base_version = match.group(1)
          beta_number = int(match.group(2))
          old_version = f'{base_version}-b{beta_number}'
          new_version = f'{base_version}-b{beta_number + 1}'
          pubspec = pubspec[:match.start()] + f'version: {new_version}' + pubspec[match.end():]
          pubspec_path.write_text(pubspec)

          update_path = Path('lib/services/update_service.dart')
          update = update_path.read_text()
          old_line = f"static const currentVersion = '{old_version}';"
          new_line = f"static const currentVersion = '{new_version}';"
          if update.count(old_line) != 1:
              raise SystemExit(
                  f'Versione runtime {old_version} non allineata o non trovata; nessuna modifica versione applicata.'
              )
          update_path.write_text(update.replace(old_line, new_line, 1))

          print(f'Versione beta: {old_version} -> {new_version}')
          PY

          git diff --check
          git diff -- lib/pages/cash_page.dart pubspec.yaml lib/services/update_service.dart

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MaydayAlaska'
          git config user.email '43659965+MaydayAlaska@users.noreply.github.com'
          git add lib/pages/cash_page.dart pubspec.yaml lib/services/update_service.dart
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da registrare.'
            exit 0
          fi
          git commit -m 'ui: move generic keypad under total and bump beta [layout-bump]'
          git pull --rebase origin Flutter
          git push origin HEAD:Flutter
