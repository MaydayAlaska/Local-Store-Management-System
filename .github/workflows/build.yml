name: Build and package Flutter desktop app

on:
  push:
    branches: [Flutter, main]
  pull_request:
    branches: [Flutter, main]

concurrency:
  group: flutter-build-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ICON_BASE64: assets/app-icon.base64
  LINUX_APPLICATION_ID: com.maydayalaska.local_store_management

jobs:
  verify:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify embedded ANPR dataset is current
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/update_birth_places.py
          if ! git diff --quiet -- assets/data/birth_places.json assets/data/birth_places_manifest.json; then
            echo "::error::Il dataset ANPR incorporato non coincide con la fonte ufficiale corrente."
            git diff --stat -- assets/data/birth_places.json assets/data/birth_places_manifest.json
            exit 1
          fi

      - name: Verify Linux desktop and AppStream metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          app_id = os.environ['LINUX_APPLICATION_ID']
          desktop_path = Path('packaging/linux') / f'{app_id}.desktop'
          if not desktop_path.is_file():
              raise SystemExit(f'Desktop file mancante: {desktop_path}')

          desktop = desktop_path.read_text()
          required_lines = {
              'Name=Local Store Management System',
              f'Icon={app_id}',
              'Exec=local_store_management',
          }
          missing = sorted(line for line in required_lines if line not in desktop.splitlines())
          if missing:
              raise SystemExit(f'Desktop file non coerente: {missing}')

          metadata_path = Path(
              'packaging/linux/io.github.MaydayAlaska.LocalStoreManagementSystem.metainfo.xml'
          )
          root = ET.parse(metadata_path).getroot()
          launchable = root.find("launchable[@type='desktop-id']")
          expected = f'{app_id}.desktop'
          if launchable is None or (launchable.text or '').strip() != expected:
              raise SystemExit(
                  f'AppStream launchable non coerente: atteso {expected}'
              )
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Linux runner
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=linux --project-name local_store_management --org com.maydayalaska .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          expected = os.environ['LINUX_APPLICATION_ID']
          path = Path('linux/CMakeLists.txt')
          text = path.read_text()
          pattern = r'set\(APPLICATION_ID\s+"[^"]+"\)'
          matches = re.findall(pattern, text)
          if len(matches) != 1:
              raise SystemExit(
                  f'APPLICATION_ID Linux non individuato in modo univoco: {len(matches)} occorrenze'
              )
          text = re.sub(
              pattern,
              f'set(APPLICATION_ID "{expected}")',
              text,
              count=1,
          )
          path.write_text(text)
          if f'set(APPLICATION_ID "{expected}")' not in path.read_text():
              raise SystemExit('Impossibile configurare APPLICATION_ID Linux')
          PY

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: SQLite smoke test
        run: flutter test

  package-windows-x64:
    name: Windows installer (x64) — priority
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter x64 host SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          cache: true

      - name: Show Flutter and host architecture
        shell: pwsh
        run: |
          flutter --version
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "PROCESSOR_ARCHITEW6432=$env:PROCESSOR_ARCHITEW6432"

      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name local_store_management --org com.maydayalaska .

      - name: Prepare Windows application icon
        shell: pwsh
        run: |
          flutter pub get
          dart run tool/generate_windows_icon.dart "${{ env.ICON_BASE64 }}" "windows/runner/resources/app_icon.ico"

      - name: Resolve packages
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          $commit = if ("${{ github.event.pull_request.head.sha }}") { "${{ github.event.pull_request.head.sha }}" } else { "${{ github.sha }}" }
          $branch = if ("${{ github.head_ref }}") { "${{ github.head_ref }}" } else { "${{ github.ref_name }}" }
          flutter build windows --release --dart-define="GIT_COMMIT=$commit" --dart-define="BUILD_BRANCH=$branch"

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $rawVersion = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1).Matches.Groups[1].Value)
          $version = $rawVersion -replace '\+', '.'
          $publishDir = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $outputDir = (Resolve-Path 'dist').Path
          $iconFile = (Resolve-Path 'windows/runner/resources/app_icon.ico').Path
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)
          if (-not $iscc) {
            $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup *\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw 'ISCC.exe (Inno Setup) non trovato nel runner Windows.' }
          & $iscc "/DPublishDir=$publishDir" "/DOutputDir=$outputDir" "/DAppVersion=$version" "/DIconFile=$iconFile" "/DAllowedArchitectures=x64compatible" "/DOutputBaseFilename=LocalStoreManagement-Setup-win-x64" 'packaging/windows/installer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows x64 installer immediately
        uses: actions/upload-artifact@v6
        with:
          name: package-win-x64
          path: dist/LocalStoreManagement-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 1

  package-windows-arm64:
    name: Windows installer (arm64)
    needs: package-windows-x64
    runs-on: windows-11-vs2026-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter x64 host SDK for Windows ARM64
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          cache: false

      - name: Show Flutter and host architecture
        shell: pwsh
        run: |
          flutter --version
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "PROCESSOR_ARCHITEW6432=$env:PROCESSOR_ARCHITEW6432"

      - name: Force Flutter Windows ARM64 host detection
        shell: pwsh
        run: |
          $source = Join-Path $env:FLUTTER_ROOT 'packages/flutter_tools/lib/src/base/os.dart'
          $text = Get-Content -Raw $source
          $pattern = '(?s)HostPlatform get hostPlatform \{\s*return switch \(_currentAbi\) \{.*?\n\s*\};\s*\n\s*\}'
          $matches = [regex]::Matches($text, $pattern)
          if ($matches.Count -ne 1) {
            throw "Impossibile applicare il workaround Windows ARM64: trovati $($matches.Count) getter hostPlatform compatibili."
          }
          $replacement = "HostPlatform get hostPlatform {`n    return HostPlatform.windows_arm64;`n  }"
          $patched = [regex]::Replace($text, $pattern, $replacement, 1)
          [IO.File]::WriteAllText($source, $patched)

          Remove-Item (Join-Path $env:FLUTTER_ROOT 'bin/cache/flutter_tools.snapshot') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:FLUTTER_ROOT 'bin/cache/flutter_tools.stamp') -Force -ErrorAction SilentlyContinue

          flutter --version
          flutter precache --windows --force

      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name local_store_management --org com.maydayalaska .

      - name: Prepare Windows application icon
        shell: pwsh
        run: |
          flutter pub get
          dart run tool/generate_windows_icon.dart "${{ env.ICON_BASE64 }}" "windows/runner/resources/app_icon.ico"

      - name: Resolve packages
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          $commit = if ("${{ github.event.pull_request.head.sha }}") { "${{ github.event.pull_request.head.sha }}" } else { "${{ github.sha }}" }
          $branch = if ("${{ github.head_ref }}") { "${{ github.head_ref }}" } else { "${{ github.ref_name }}" }
          flutter build windows --release --dart-define="GIT_COMMIT=$commit" --dart-define="BUILD_BRANCH=$branch"

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $rawVersion = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1).Matches.Groups[1].Value)
          $version = $rawVersion -replace '\+', '.'
          $publishDir = (Resolve-Path 'build/windows/arm64/runner/Release').Path
          $outputDir = (Resolve-Path 'dist').Path
          $iconFile = (Resolve-Path 'windows/runner/resources/app_icon.ico').Path
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)
          if (-not $iscc) {
            $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup *\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw 'ISCC.exe (Inno Setup) non trovato nel runner Windows.' }
          & $iscc "/DPublishDir=$publishDir" "/DOutputDir=$outputDir" "/DAppVersion=$version" "/DIconFile=$iconFile" "/DAllowedArchitectures=arm64" "/DOutputBaseFilename=LocalStoreManagement-Setup-win-arm64" 'packaging/windows/installer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows ARM64 installer for release jobs
        uses: actions/upload-artifact@v6
        with:
          name: package-win-arm64
          path: dist/LocalStoreManagement-Setup-win-arm64.exe
          if-no-files-found: error
          retention-days: 1

  package-macos:
    name: macOS DMG (${{ matrix.arch }})
    needs: package-windows-x64
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            flutter_arch: arm64
            macho_arch: arm64
            excluded_arch: x86_64
          - runner: macos-15
            arch: x64
            flutter_arch: arm64
            macho_arch: x86_64
            excluded_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: ${{ matrix.flutter_arch }}
          cache: true

      - name: Show Flutter, macOS and host architecture
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          flutter --version
          xcodebuild -version
          if [ "$(uname -m)" != "arm64" ]; then
            echo '::error::La build macOS deve usare esclusivamente un host Apple Silicon.'
            exit 1
          fi

      - name: Generate macOS runner
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-macos-desktop
          flutter create --platforms=macos --project-name local_store_management --org com.maydayalaska .

      - name: Configure macOS bundle, privacy, entitlements and architecture
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.macho_arch }}
          EXCLUDED_ARCH: ${{ matrix.excluded_arch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          import re
          from pathlib import Path

          app_info = Path('macos/Runner/Configs/AppInfo.xcconfig')
          text = app_info.read_text()
          text = re.sub(
              r'^PRODUCT_NAME\s*=.*$',
              'PRODUCT_NAME = Local Store Management System',
              text,
              flags=re.MULTILINE,
          )
          app_info.write_text(text)

          release_config = Path('macos/Runner/Configs/Release.xcconfig')
          with release_config.open('a') as handle:
              handle.write(f"\nARCHS = {os.environ['TARGET_ARCH']}\n")
              handle.write(f"EXCLUDED_ARCHS = {os.environ['EXCLUDED_ARCH']}\n")

          info_path = Path('macos/Runner/Info.plist')
          with info_path.open('rb') as handle:
              info = plistlib.load(handle)
          info['NSLocalNetworkUsageDescription'] = (
              'Local Store Management System usa la rete locale per comunicare '
              'con stampanti e dispositivi del negozio.'
          )
          with info_path.open('wb') as handle:
              plistlib.dump(info, handle, sort_keys=False)

          pbxproj_path = Path('macos/Runner.xcodeproj/project.pbxproj')
          project = pbxproj_path.read_text()
          tripwire_index = project.find('touch Flutter/ephemeral/tripwire')
          if tripwire_index < 0:
              raise RuntimeError('Build phase Flutter Assemble non trovata.')
          phase_start = project.rfind('/* ShellScript */ = {', 0, tripwire_index)
          phase_end = project.find('\n\t\t};', tripwire_index)
          if phase_start < 0 or phase_end < 0:
              raise RuntimeError('Impossibile delimitare la build phase Flutter Assemble.')
          phase = project[phase_start:phase_end]
          if 'alwaysOutOfDate = 1;' not in phase:
              isa_line = '\t\t\tisa = PBXShellScriptBuildPhase;\n'
              if isa_line not in phase:
                  raise RuntimeError('Formato PBXShellScriptBuildPhase inatteso.')
              phase = phase.replace(
                  isa_line,
                  isa_line + '\t\t\talwaysOutOfDate = 1;\n',
                  1,
              )
              project = project[:phase_start] + phase + project[phase_end:]
              pbxproj_path.write_text(project)

          entitlement_keys = {
              'com.apple.security.app-sandbox': True,
              'com.apple.security.network.client': True,
              'com.apple.security.files.user-selected.read-write': True,
              'com.apple.security.print': True,
          }
          for relative in (
              'macos/Runner/Release.entitlements',
              'macos/Runner/DebugProfile.entitlements',
          ):
              path = Path(relative)
              with path.open('rb') as handle:
                  data = plistlib.load(handle)
              data.update(entitlement_keys)
              with path.open('wb') as handle:
                  plistlib.dump(data, handle, sort_keys=False)
          PY

      - name: Prepare macOS application icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = Path('assets/app-icon.base64').read_text().strip()
          Path(os.environ['RUNNER_TEMP'], 'lsms-app-icon.png').write_bytes(
              base64.b64decode(encoded)
          )
          PY
          SOURCE="$RUNNER_TEMP/lsms-app-icon.png"
          ICONSET="macos/Runner/Assets.xcassets/AppIcon.appiconset"
          for size in 16 32 64 128 256 512 1024; do
            sips -z "$size" "$size" "$SOURCE" --out "$ICONSET/app_icon_${size}.png" >/dev/null
          done

      - name: Resolve packages
        run: flutter pub get

      - name: Build macOS release
        shell: bash
        run: |
          set -euo pipefail
          COMMIT='${{ github.event.pull_request.head.sha }}'
          if [ -z "$COMMIT" ]; then COMMIT='${{ github.sha }}'; fi
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          flutter build macos --release --dart-define="GIT_COMMIT=$COMMIT" --dart-define="BUILD_BRANCH=$BRANCH"

      - name: Verify macOS application architecture
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo 'Bundle .app non trovato.' >&2
            exit 1
          fi
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          ARCHES="$(lipo -archs "$APP/Contents/MacOS/$EXECUTABLE")"
          echo "Bundle: $APP"
          echo "Executable architectures: $ARCHES"
          case " $ARCHES " in
            *" ${{ matrix.macho_arch }} "*) ;;
            *) echo 'Architettura richiesta assente dal bundle.' >&2; exit 1 ;;
          esac
          case " $ARCHES " in
            *" ${{ matrix.excluded_arch }} "*) echo 'Il bundle contiene anche l’architettura che doveva essere esclusa.' >&2; exit 1 ;;
            *) ;;
          esac

      - name: Build DMG with Applications shortcut
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          rm -rf dmg-root dist
          mkdir -p dmg-root dist
          ditto "$APP" "dmg-root/Local Store Management System.app"
          ln -s /Applications "dmg-root/Applications"
          hdiutil create \
            -volname 'Local Store Management System' \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "dist/LocalStoreManagement-macos-${{ matrix.arch }}.dmg"
          hdiutil imageinfo "dist/LocalStoreManagement-macos-${{ matrix.arch }}.dmg" >/dev/null

      - name: Upload macOS DMG for release jobs
        uses: actions/upload-artifact@v6
        with:
          name: package-macos-${{ matrix.arch }}
          path: dist/LocalStoreManagement-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 1

  package-linux:
    name: Linux packages (${{ matrix.arch }})
    needs: package-windows-x64
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
            build_arch: x64
            deb_arch: amd64
            appimage_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            build_arch: arm64
            deb_arch: arm64
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Linux desktop dependencies
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 \
            -o Dpkg::Use-Pty=0 \
            install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            squashfs-tools curl git unzip xz-utils python3-pil

      - name: Setup Flutter x64
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          cache: true

      - name: Bootstrap Flutter ARM64 from official stable branch
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_ROOT="$RUNNER_TEMP/flutter-arm64"
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          "$FLUTTER_ROOT/bin/flutter" --version
          "$FLUTTER_ROOT/bin/flutter" config --enable-linux-desktop
          "$FLUTTER_ROOT/bin/flutter" precache --linux

      - name: Show Flutter and host architecture
        shell: bash
        run: |
          uname -m
          flutter --version

      - name: Generate and configure Linux runner
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=linux --project-name local_store_management --org com.maydayalaska .
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          expected = os.environ['LINUX_APPLICATION_ID']
          path = Path('linux/CMakeLists.txt')
          text = path.read_text()
          pattern = r'set\(APPLICATION_ID\s+"[^"]+"\)'
          matches = re.findall(pattern, text)
          if len(matches) != 1:
              raise SystemExit(
                  f'APPLICATION_ID Linux non individuato in modo univoco: {len(matches)} occorrenze'
              )
          path.write_text(
              re.sub(pattern, f'set(APPLICATION_ID "{expected}")', text, count=1)
          )
          PY
          grep -F "set(APPLICATION_ID \"${LINUX_APPLICATION_ID}\")" linux/CMakeLists.txt

      - name: Resolve packages
        run: flutter pub get

      - name: Build Linux release
        shell: bash
        run: |
          set -euo pipefail
          COMMIT='${{ github.event.pull_request.head.sha }}'
          if [ -z "$COMMIT" ]; then COMMIT='${{ github.sha }}'; fi
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          flutter build linux --release --dart-define="GIT_COMMIT=$COMMIT" --dart-define="BUILD_BRANCH=$BRANCH"

      - name: Prepare Linux application icons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          from PIL import Image

          source = Path(os.environ['RUNNER_TEMP']) / 'lsms-linux-icon.png'
          source.write_bytes(
              base64.b64decode(Path('assets/app-icon.base64').read_text().strip())
          )
          with Image.open(source) as image:
              image = image.convert('RGBA')
              for size in (16, 32, 48, 64, 128, 256):
                  target = Path(os.environ['RUNNER_TEMP']) / f'lsms-linux-icon-{size}.png'
                  image.resize(
                      (size, size),
                      Image.Resampling.LANCZOS,
                  ).save(target, format='PNG')
          PY

      - name: Build AppDir
        shell: bash
        run: |
          set -euo pipefail
          APP_ID="$LINUX_APPLICATION_ID"
          DESKTOP="packaging/linux/${APP_ID}.desktop"
          rm -rf AppDir dist
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/metainfo \
                   dist
          cp -a build/linux/${{ matrix.build_arch }}/release/bundle/. AppDir/usr/bin/
          cp packaging/linux/AppRun AppDir/AppRun
          cp "$DESKTOP" "AppDir/${APP_ID}.desktop"
          cp "$DESKTOP" "AppDir/usr/share/applications/${APP_ID}.desktop"
          cp packaging/linux/io.github.MaydayAlaska.LocalStoreManagementSystem.metainfo.xml AppDir/usr/share/metainfo/io.github.MaydayAlaska.LocalStoreManagementSystem.metainfo.xml
          for size in 16 32 48 64 128 256; do
            target="AppDir/usr/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$target"
            cp "$RUNNER_TEMP/lsms-linux-icon-${size}.png" "$target/${APP_ID}.png"
          done
          cp "$RUNNER_TEMP/lsms-linux-icon-256.png" "AppDir/${APP_ID}.png"
          ln -s "${APP_ID}.png" AppDir/.DirIcon
          chmod +x AppDir/AppRun AppDir/usr/bin/local_store_management
          test -f "AppDir/${APP_ID}.desktop"
          test -L AppDir/.DirIcon
          test "$(readlink AppDir/.DirIcon)" = "${APP_ID}.png"

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          TOOL="appimagetool-${{ matrix.appimage_arch }}.AppImage"
          curl --fail --location --retry 3 --output "$TOOL" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/$TOOL"
          chmod +x "$TOOL"
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=${{ matrix.appimage_arch }} ./"$TOOL" AppDir dist/LocalStoreManagement-linux-${{ matrix.arch }}.AppImage
          chmod +x dist/LocalStoreManagement-linux-${{ matrix.arch }}.AppImage

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          APP_ID="$LINUX_APPLICATION_ID"
          DESKTOP="packaging/linux/${APP_ID}.desktop"
          RAW_VERSION="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          DEB_VERSION="${RAW_VERSION/+/.}"
          rm -rf DebRoot
          mkdir -p DebRoot/DEBIAN \
                   DebRoot/usr/bin \
                   DebRoot/usr/lib/local-store-management \
                   DebRoot/usr/share/applications \
                   DebRoot/usr/share/metainfo
          cp -a build/linux/${{ matrix.build_arch }}/release/bundle/. DebRoot/usr/lib/local-store-management/
          cp "$DESKTOP" "DebRoot/usr/share/applications/${APP_ID}.desktop"
          cp packaging/linux/io.github.MaydayAlaska.LocalStoreManagementSystem.metainfo.xml DebRoot/usr/share/metainfo/io.github.MaydayAlaska.LocalStoreManagementSystem.metainfo.xml
          for size in 16 32 48 64 128 256; do
            target="DebRoot/usr/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$target"
            cp "$RUNNER_TEMP/lsms-linux-icon-${size}.png" "$target/${APP_ID}.png"
          done
          cat > DebRoot/usr/bin/local_store_management <<'EOF'
          #!/bin/sh
          exec /usr/lib/local-store-management/local_store_management "$@"
          EOF
          cat > DebRoot/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
          fi
          exit 0
          EOF
          cat > DebRoot/DEBIAN/postrm <<'EOF'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
          fi
          exit 0
          EOF
          chmod +x DebRoot/usr/bin/local_store_management \
                   DebRoot/usr/lib/local-store-management/local_store_management \
                   DebRoot/DEBIAN/postinst \
                   DebRoot/DEBIAN/postrm
          INSTALLED_SIZE="$(du -sk DebRoot/usr | cut -f1)"
          cat > DebRoot/DEBIAN/control <<EOF
          Package: local-store-management-system
          Version: ${DEB_VERSION}
          Section: office
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: MaydayAlaska
          Depends: libgtk-3-0, libblkid1, liblzma5, hicolor-icon-theme
          Installed-Size: ${INSTALLED_SIZE}
          Description: Local Store Management System
           Gestionale desktop offline per negozio.
          EOF
          dpkg-deb --build --root-owner-group DebRoot dist/LocalStoreManagement-linux-${{ matrix.arch }}.deb

      - name: Upload Linux packages for release jobs
        uses: actions/upload-artifact@v6
        with:
          name: package-linux-${{ matrix.arch }}
          path: |
            dist/LocalStoreManagement-linux-${{ matrix.arch }}.AppImage
            dist/LocalStoreManagement-linux-${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 1

  release-beta:
    name: Publish Flutter beta assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/Flutter'
    needs: [package-windows-x64, package-windows-arm64, package-macos, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Publish beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RAW_VERSION="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          VERSION="$RAW_VERSION"
          TAG='beta-latest'
          mv dist/LocalStoreManagement-Setup-win-x64.exe "dist/LocalStoreManagement-${VERSION}-BETA-Setup-win-x64.exe"
          mv dist/LocalStoreManagement-Setup-win-arm64.exe "dist/LocalStoreManagement-${VERSION}-BETA-Setup-win-arm64.exe"
          mv dist/LocalStoreManagement-macos-x64.dmg "dist/LocalStoreManagement-${VERSION}-BETA-macos-x64.dmg"
          mv dist/LocalStoreManagement-macos-arm64.dmg "dist/LocalStoreManagement-${VERSION}-BETA-macos-arm64.dmg"
          mv dist/LocalStoreManagement-linux-x64.AppImage "dist/LocalStoreManagement-${VERSION}-BETA-linux-x64.AppImage"
          mv dist/LocalStoreManagement-linux-x64.deb "dist/LocalStoreManagement-${VERSION}-BETA-linux-x64.deb"
          mv dist/LocalStoreManagement-linux-arm64.AppImage "dist/LocalStoreManagement-${VERSION}-BETA-linux-arm64.AppImage"
          mv dist/LocalStoreManagement-linux-arm64.deb "dist/LocalStoreManagement-${VERSION}-BETA-linux-arm64.deb"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Local Store Management v${VERSION} BETA (${GITHUB_SHA::7})" \
            --notes 'Versione BETA generata automaticamente dal branch Flutter. Include Windows x64/ARM64, macOS Intel/Apple Silicon in formato DMG e Linux x64/ARM64 in formato AppImage e DEB. Le versioni validate vengono poi promosse su main.'

  release-main:
    name: Publish main release assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [package-windows-x64, package-windows-arm64, package-macos, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Publish stable release and OTA bridge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RAW_VERSION="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          VERSION="$RAW_VERSION"
          STABLE_TAG="v${VERSION}"
          LEGACY_TAG="ota-${GITHUB_SHA}"
          while IFS= read -r old_tag; do
            [ -z "$old_tag" ] && continue
            gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,name --jq '.[] | select(.name | startswith("Legacy OTA bridge")) | .tagName')
          if gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          if gh release view "$LEGACY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$LEGACY_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$LEGACY_TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Legacy OTA bridge v${VERSION}" \
            --notes 'Release tecnica per gli aggiornamenti automatici.'
          mkdir stable-dist
          cp dist/LocalStoreManagement-Setup-win-x64.exe "stable-dist/LocalStoreManagement-${VERSION}-Setup-win-x64.exe"
          cp dist/LocalStoreManagement-Setup-win-arm64.exe "stable-dist/LocalStoreManagement-${VERSION}-Setup-win-arm64.exe"
          cp dist/LocalStoreManagement-macos-x64.dmg "stable-dist/LocalStoreManagement-${VERSION}-macos-x64.dmg"
          cp dist/LocalStoreManagement-macos-arm64.dmg "stable-dist/LocalStoreManagement-${VERSION}-macos-arm64.dmg"
          cp dist/LocalStoreManagement-linux-x64.AppImage "stable-dist/LocalStoreManagement-${VERSION}-linux-x64.AppImage"
          cp dist/LocalStoreManagement-linux-x64.deb "stable-dist/LocalStoreManagement-${VERSION}-linux-x64.deb"
          cp dist/LocalStoreManagement-linux-arm64.AppImage "stable-dist/LocalStoreManagement-${VERSION}-linux-arm64.AppImage"
          cp dist/LocalStoreManagement-linux-arm64.deb "stable-dist/LocalStoreManagement-${VERSION}-linux-arm64.deb"
          gh release create "$STABLE_TAG" stable-dist/* --repo "$GITHUB_REPOSITORY" --latest=true \
            --title "Local Store Management v${VERSION}" \
            --notes "Release stabile v${VERSION}. Windows x64/ARM64, macOS Intel/Apple Silicon (DMG) e Linux x64/ARM64 (AppImage + DEB)."
