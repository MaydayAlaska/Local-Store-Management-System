          )
          model = replace_once(
              model,
              """    String? currencyCode,
    String? themeMode,
""",
              """    String? currencyCode,
    double? vatPercent,
    String? themeMode,
""",
              'copyWith parametro VAT',
          )
          model = replace_once(
              model,
              """        currencyCode: currencyCode ?? this.currencyCode,
        themeMode: themeMode ?? this.themeMode,
""",
