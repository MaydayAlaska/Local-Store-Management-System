name: Implement gift card cash flow fixes

on:
  push:
    branches: [Flutter]
    paths:
      - '.github/implement_optional_gift_card_owner.py'
      - '.github/run_gift_card_cash_flow_fix.py'
      - '.github/workflows/implement-optional-gift-card-owner-once.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: Flutter

      - name: Record run id
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > /tmp/gift-card-cash-flow-run.txt
          CONTENT="$(base64 -w0 /tmp/gift-card-cash-flow-run.txt)"
          EXISTING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/gift-card-cash-flow-run.txt?ref=Flutter" --jq .sha 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.github/gift-card-cash-flow-run.txt" \
              -f message='Record gift card cash flow workflow run' \
              -f content="$CONTENT" -f branch='Flutter' -f sha="$EXISTING_SHA" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/.github/gift-card-cash-flow-run.txt" \
              -f message='Record gift card cash flow workflow run' \
              -f content="$CONTENT" -f branch='Flutter' >/dev/null
          fi

      - name: Apply implementation
        run: python3 .github/run_gift_card_cash_flow_fix.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Linux runner
        shell: bash
        run: |
          flutter create --platforms=linux --project-name local_store_management --org com.maydayalaska .
          rm -f test/widget_test.dart

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lib/pages/customers_page.dart lib/pages/cash_page.dart lib/repositories/customer_repository.dart test/customer_repository_test.dart
          git diff --cached --check
          git commit -m 'Refine gift card creation and payment flow'
          git reset --hard HEAD
          git clean -fd
          git fetch origin Flutter
          git rebase origin/Flutter
          git push origin HEAD:Flutter
