name: Implement optional gift card ownership once

on:
  push:
    branches: [Flutter]
    paths:
      - '.github/workflows/implement-optional-gift-card-owner-once.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: Flutter

      - name: Apply implementation
        run: python3 .github/implement_optional_gift_card_owner.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Linux runner
        shell: bash
        run: |
          flutter create --platforms=linux --project-name local_store_management --org com.maydayalaska .
          rm -f test/widget_test.dart

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lib/models/customer.dart lib/repositories/customer_repository.dart lib/pages/cash_page.dart lib/pages/gift_card_purchase_dialog.dart lib/pages/gift_card_editor_dialog.dart lib/pages/gift_cards_page.dart test/customer_repository_test.dart test/gift_card_cleanup_test.dart
          git diff --cached --check
          git commit -m 'Make gift card customer association optional'
          git push origin HEAD:Flutter

# trigger 9
