name: Build and package desktop app

on:
  push:
    branches:
      - test
      - main
  pull_request:
    branches:
      - test
      - main

concurrency:
  group: build-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: src/LocalStoreManagement.Desktop/LocalStoreManagement.Desktop.csproj
  ICON_BASE64: src/LocalStoreManagement.Desktop/Assets/app-icon.base64
  ICON_ICO: src/LocalStoreManagement.Desktop/Assets/app-icon.ico

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Windows application icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $png = [Convert]::FromBase64String((Get-Content -Raw "${{ env.ICON_BASE64 }}").Trim())
          $iconPath = "${{ env.ICON_ICO }}"
          $stream = [IO.File]::Open($iconPath, [IO.FileMode]::Create, [IO.FileAccess]::Write)
          try {
            $writer = [IO.BinaryWriter]::new($stream)
            $writer.Write([UInt16]0)
            $writer.Write([UInt16]1)
            $writer.Write([UInt16]1)
            $writer.Write([Byte]64)
            $writer.Write([Byte]64)
            $writer.Write([Byte]0)
            $writer.Write([Byte]0)
            $writer.Write([UInt16]1)
            $writer.Write([UInt16]32)
            $writer.Write([UInt32]$png.Length)
            $writer.Write([UInt32]22)
            $writer.Write($png)
            $writer.Flush()
          }
          finally {
            $stream.Dispose()
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        run: dotnet build ${{ env.PROJECT }} --configuration Release --no-restore

      - name: Fresh database smoke test
        run: dotnet run --project ${{ env.PROJECT }} --configuration Release --no-build -- --database-smoke-test

  package-windows:
    name: Windows installer
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Windows application icon
        shell: pwsh
        run: |
          $png = [Convert]::FromBase64String((Get-Content -Raw "${{ env.ICON_BASE64 }}").Trim())
          $iconPath = "${{ env.ICON_ICO }}"
          $stream = [IO.File]::Open($iconPath, [IO.FileMode]::Create, [IO.FileAccess]::Write)
          try {
            $writer = [IO.BinaryWriter]::new($stream)
            $writer.Write([UInt16]0)
            $writer.Write([UInt16]1)
            $writer.Write([UInt16]1)
            $writer.Write([Byte]64)
            $writer.Write([Byte]64)
            $writer.Write([Byte]0)
            $writer.Write([Byte]0)
            $writer.Write([UInt16]1)
            $writer.Write([UInt16]32)
            $writer.Write([UInt32]$png.Length)
            $writer.Write([UInt32]22)
            $writer.Write($png)
            $writer.Flush()
          }
          finally {
            $stream.Dispose()
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows x64
        run: dotnet publish ${{ env.PROJECT }} --configuration Release --runtime win-x64 --self-contained true --output publish/win-x64

      - name: Write build information
        shell: pwsh
        run: |
          [xml]$project = Get-Content "${{ env.PROJECT }}"
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          $branch = if ("${{ github.head_ref }}") { "${{ github.head_ref }}" } else { "${{ github.ref_name }}" }
          $commit = if ("${{ github.event.pull_request.head.sha }}") { "${{ github.event.pull_request.head.sha }}" } else { "${{ github.sha }}" }
          $info = [ordered]@{
            version = "$version"
            commit = "$commit"
            branch = "$branch"
          }
          $info | ConvertTo-Json | Set-Content -Encoding utf8 "publish/win-x64/build-info.json"

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          [xml]$project = Get-Content "${{ env.PROJECT }}"
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          $publishDir = (Resolve-Path "publish/win-x64").Path
          $outputDir = (Resolve-Path "dist").Path
          $iconFile = (Resolve-Path "${{ env.ICON_ICO }}").Path

          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)
          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\Program Files*\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) {
            throw "ISCC.exe (Inno Setup) non trovato nel runner Windows."
          }

          & $iscc "/DPublishDir=$publishDir" "/DOutputDir=$outputDir" "/DAppVersion=$version" "/DIconFile=$iconFile" "packaging/windows/installer.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: package-win-x64
          path: dist/LocalStoreManagement-Setup-win-x64.exe
          if-no-files-found: error

  package-linux:
    name: Linux AppImage
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Linux x64
        run: dotnet publish ${{ env.PROJECT }} --configuration Release --runtime linux-x64 --self-contained true --output publish/linux-x64

      - name: Write build information
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "${PROJECT}" | head -n 1)"
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          COMMIT="${{ github.event.pull_request.head.sha }}"
          if [ -z "${COMMIT}" ]; then
            COMMIT="${GITHUB_SHA}"
          fi
          printf '{"version":"%s","commit":"%s","branch":"%s"}\n' \
            "${VERSION}" "${COMMIT}" "${BRANCH}" \
            > publish/linux-x64/build-info.json

      - name: Build AppDir
        shell: bash
        run: |
          set -euo pipefail
          rm -rf AppDir dist
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/64x64/apps dist
          cp -a publish/linux-x64/. AppDir/usr/bin/
          cp packaging/linux/AppRun AppDir/AppRun
          cp packaging/linux/local-store-management.desktop AppDir/local-store-management.desktop
          base64 --decode "${ICON_BASE64}" > AppDir/local-store-management.png
          cp AppDir/local-store-management.png AppDir/usr/share/icons/hicolor/64x64/apps/local-store-management.png
          ln -s local-store-management.png AppDir/.DirIcon
          chmod +x AppDir/AppRun AppDir/usr/bin/LocalStoreManagement.Desktop

      - name: Install AppImage build dependency
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
            ./appimagetool-x86_64.AppImage \
            AppDir \
            dist/LocalStoreManagement-linux-x64.AppImage
          chmod +x dist/LocalStoreManagement-linux-x64.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: dist/LocalStoreManagement-linux-x64.AppImage
          if-no-files-found: error

  release-test:
    name: Publish test beta assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    needs: [build, package-windows, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged applications
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Publish beta prerelease for test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "${PROJECT}" | head -n 1)"
          TAG="test-latest"

          mv dist/LocalStoreManagement-Setup-win-x64.exe \
            "dist/LocalStoreManagement-${VERSION}-BETA-Setup-win-x64.exe"
          mv dist/LocalStoreManagement-linux-x64.AppImage \
            "dist/LocalStoreManagement-${VERSION}-BETA-linux-x64.AppImage"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Local Store Management v${VERSION} BETA / TEST (${GITHUB_SHA::7})" \
            --notes "Versione BETA/TEST generata automaticamente dal branch test. Non è una release stabile. Usa questi pacchetti solo per verificare le modifiche prima della promozione su main."

  release-main:
    name: Publish main release assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, package-windows, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged applications
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Publish stable release and OTA compatibility bridge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "${PROJECT}" | head -n 1)"
          STABLE_TAG="v${VERSION}"
          LEGACY_TAG="ota-${GITHUB_SHA}"

          # Manteniamo un solo bridge OTA legacy: i client già installati cercano ancora ota-<sha>.
          while IFS= read -r old_tag; do
            [ -z "$old_tag" ] && continue
            gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,name \
            --jq '.[] | select(.name | startswith("Legacy OTA bridge")) | .tagName')

          if gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          if gh release view "$LEGACY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$LEGACY_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

          # Compatibilità con le versioni già distribuite, senza usare questo tag come release principale.
          gh release create "$LEGACY_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Legacy OTA bridge v${VERSION}" \
            --notes "Release tecnica per mantenere compatibili gli aggiornamenti OTA delle versioni precedenti. Per il download manuale usa la release stabile v${VERSION}."

          # Release pubblica principale con tag leggibile.
          gh release create "$STABLE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest=true \
            --title "Local Store Management v${VERSION}" \
            --notes "Release stabile v${VERSION}. Pacchetti Windows e Linux generati automaticamente dal branch main."
