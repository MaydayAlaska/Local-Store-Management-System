"""
          cash = replace_once(cash, footer_start, footer_new, 'Footer cassa')

          keypad_title = """              Row(
                children: [
                  const Icon(Icons.dialpad_rounded, size: 18),
                  const SizedBox(width: 6),
                  Expanded(
