name: Apply export OTA and price formula update

on:
  push:
    branches: [Flutter]
    paths:
      - '.apply-export-ota-price'
      - '.github/workflows/apply-export-ota-price.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Flutter
          fetch-depth: 0

      - name: Apply requested changes
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin Flutter
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub1(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')
              return updated

          # Export wording.
          p = Path('lib/services/export_service.dart')
          s = p.read_text()
          s = s.replace(
              "      InventoryExportField.purchase => AppStrings.t('purchase'),\n      InventoryExportField.sale => AppStrings.t('sale'),",
              "      InventoryExportField.purchase => AppStrings.isEnglish\n          ? 'Purchase Price'\n          : 'Prezzo di Acquisto',\n      InventoryExportField.sale => AppStrings.isEnglish\n          ? 'Sale Price'\n          : 'Prezzo di Vendita',",
          )
          if "Prezzo di Acquisto" not in s or "Prezzo di Vendita" not in s:
              raise SystemExit('Export labels were not applied')
          p.write_text(s)

          # Purchase price formula parser.
          p = Path('lib/core/formatters.dart')
          s = p.read_text()
          if 'parsePriceFormulaCents' not in s:
              s += r'''

int? parsePriceFormulaCents(String value) {
  final normalized = value
      .trim()
      .replaceAll('€', '')
      .replaceAll(r'$', '')
      .replaceAll('£', '')
      .replaceAll('CHF', '')
      .replaceAll(' ', '')
      .replaceAll(',', '.');
  if (normalized.isEmpty) return null;
  final result = _evaluatePriceExpression(normalized);
  if (!result.isFinite || result < 0) {
    throw const FormatException('Importo o formula non validi.');
  }
  return (result * 100).round();
}

double _evaluatePriceExpression(String expression) {
  final percentSuffix = RegExp(r'^(.+)([+-])(\d+(?:\.\d+)?)%$')
      .firstMatch(expression);
  if (percentSuffix != null) {
    final base = _evaluatePriceExpression(percentSuffix.group(1)!);
    final percent = double.parse(percentSuffix.group(3)!);
    final factor = percent / 100;
    return percentSuffix.group(2) == '-'
        ? base * (1 - factor)
        : base * (1 + factor);
  }
  if (expression.contains('%')) {
    throw const FormatException('Percentuale non valida nella formula.');
  }
  return _evaluateArithmeticExpression(expression);
}

double _evaluateArithmeticExpression(String expression) {
  final tokens = RegExp(r'\d+(?:\.\d+)?|[+\-*/]')
      .allMatches(expression)
      .map((match) => match.group(0)!)
      .toList();
  if (tokens.isEmpty || tokens.join() != expression || tokens.length.isEven) {
    throw const FormatException('Importo o formula non validi.');
  }

  final values = <double>[];
  final lowOps = <String>[];
  var current = double.tryParse(tokens.first);
  if (current == null) {
    throw const FormatException('Importo o formula non validi.');
  }
  for (var i = 1; i < tokens.length; i += 2) {
    final op = tokens[i];
    final operand = double.tryParse(tokens[i + 1]);
    if (operand == null) {
      throw const FormatException('Importo o formula non validi.');
    }
    switch (op) {
      case '*':
        current *= operand;
      case '/':
        if (operand == 0) {
          throw const FormatException('Divisione per zero non valida.');
        }
        current /= operand;
      case '+':
      case '-':
        values.add(current);
        lowOps.add(op);
        current = operand;
      default:
        throw const FormatException('Operatore non valido.');
    }
  }
  values.add(current);

  var result = values.first;
  for (var i = 0; i < lowOps.length; i++) {
    result = lowOps[i] == '+' ? result + values[i + 1] : result - values[i + 1];
  }
  return result;
}
'''
          p.write_text(s)

          # Product editor purchase fields: formula on save and resolve on Enter.
          p = Path('lib/pages/product_editor_dialog.dart')
          s = p.read_text()
          s = s.replace('purchasePriceCents: parseEuroCents(_purchase.text),',
                        'purchasePriceCents: parsePriceFormulaCents(_purchase.text),', 1)
          s = s.replace('purchasePriceCents: parseEuroCents(purchase.text),',
                        'purchasePriceCents: parsePriceFormulaCents(purchase.text),', 1)

          if 'void _evaluatePurchaseFormula()' not in s:
              anchor = "  String _itEn(String it, String en) => AppStrings.isEnglish ? en : it;\n\n"
              method = """  void _evaluatePurchaseFormula() {
    try {
      final cents = parsePriceFormulaCents(_purchase.text);
      if (cents == null) return;
      final formatted = _moneyInput(cents);
      _purchase.value = TextEditingValue(
        text: formatted,
        selection: TextSelection.collapsed(offset: formatted.length),
      );
      setState(() => _error = null);
    } catch (error) {
      setState(() => _error = error.toString().replaceFirst('FormatException: ', ''));
    }
  }

"""
              if anchor not in s:
                  raise SystemExit('Product editor state anchor not found')
              s = s.replace(anchor, anchor + method, 1)

          old = """                    controller: _purchase,
                    keyboardType: const TextInputType.numberWithOptions(decimal: true),
                    decoration: InputDecoration(
"""
          new = """                    controller: _purchase,
                    keyboardType: TextInputType.text,
                    textInputAction: TextInputAction.done,
                    onSubmitted: (_) => _evaluatePurchaseFormula(),
                    decoration: InputDecoration(
"""
          if old not in s:
              raise SystemExit('Product purchase field anchor not found')
          s = s.replace(old, new, 1)
          label_anchor = """                        'Product purchase price $currency',
                      ),
"""
          if "Accetta formule, es. 200-40%" not in s:
              s = s.replace(label_anchor, label_anchor + """                      helperText: _itEn(
                        'Accetta formule, es. 200-40% → 120',
                        'Formulas supported, e.g. 200-40% → 120',
                      ),
""", 1)

          if 'void _evaluateVariantPurchaseFormula()' not in s:
              variant_anchor = """class _VariantEditorState extends State<_VariantEditor> {
  String _itEn(String it, String en) => AppStrings.isEnglish ? en : it;

"""
              variant_method = """  void _evaluateVariantPurchaseFormula() {
    try {
      final cents = parsePriceFormulaCents(widget.form.purchase.text);
      if (cents == null) return;
      final formatted = _VariantForm._moneyValue(cents);
      widget.form.purchase.value = TextEditingValue(
        text: formatted,
        selection: TextSelection.collapsed(offset: formatted.length),
      );
    } catch (error) {
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(content: Text(error.toString().replaceFirst('FormatException: ', ''))),
      );
    }
  }

"""
              if variant_anchor not in s:
                  raise SystemExit('Variant editor anchor not found')
              s = s.replace(variant_anchor, variant_anchor + variant_method, 1)

          old = """                controller: widget.form.purchase,
                keyboardType: const TextInputType.numberWithOptions(decimal: true),
                decoration: InputDecoration(
"""
          new = """                controller: widget.form.purchase,
                keyboardType: TextInputType.text,
                textInputAction: TextInputAction.done,
                onSubmitted: (_) => _evaluateVariantPurchaseFormula(),
                decoration: InputDecoration(
"""
          if old not in s:
              raise SystemExit('Variant purchase field anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # OTA hardening: exact OS + ABI matching, versioned beta asset validation.
          p = Path('lib/services/update_service.dart')
          s = p.read_text()
          if 'bool updateAssetMatchesFor({' not in s:
              marker = "bool isBetaBranch(String branch) => branch.trim().toLowerCase() == 'flutter';"
              helper = """bool updateAssetMatchesFor({
  required String assetName,
  required String operatingSystem,
  required Abi abi,
  required bool beta,
}) {
  final normalized = assetName.trim();
  if (!beta) {
    return normalized == updateAssetNameFor(
      operatingSystem: operatingSystem,
      abi: abi,
    );
  }

  final suffix = betaUpdateAssetSuffixFor(
    operatingSystem: operatingSystem,
    abi: abi,
  );
  const prefix = 'LocalStoreManagement-';
  if (!normalized.startsWith(prefix) || !normalized.endsWith(suffix)) {
    return false;
  }
  final version = normalized.substring(
    prefix.length,
    normalized.length - suffix.length,
  );
  return versionBelongsToUpdateChannel(version, beta: true);
}

"""
              if marker not in s:
                  raise SystemExit('OTA helper anchor not found')
              s = s.replace(marker, helper + marker, 1)

          s = s.replace("static const currentVersion = '0.1.6-b10';",
                        "static const currentVersion = '0.1.6-b11';", 1)
          s = re.sub(r"\n  String _expectedBetaAssetSuffix\(\) => betaUpdateAssetSuffixFor\(\n        operatingSystem: Platform\.operatingSystem,\n        abi: Abi\.current\(\),\n      \);\n", "\n", s, count=1)
          old = """    final expected = _expectedAssetName();
    final betaSuffix = beta ? _expectedBetaAssetSuffix() : null;

    for (final raw in (release['assets'] as List<dynamic>? ?? const [])) {
      final asset = raw as Map<String, dynamic>;
      final name = asset['name'] as String? ?? '';
      final matches = beta ? name.endsWith(betaSuffix!) : name == expected;
      if (matches) return asset['url'] as String?;
    }
"""
          new = """    for (final raw in (release['assets'] as List<dynamic>? ?? const [])) {
      final asset = raw as Map<String, dynamic>;
      final name = asset['name'] as String? ?? '';
      final matches = updateAssetMatchesFor(
        assetName: name,
        operatingSystem: Platform.operatingSystem,
        abi: Abi.current(),
        beta: beta,
      );
      if (matches) return asset['url'] as String?;
    }
"""
          if old not in s:
              raise SystemExit('OTA selection block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # OTA tests for cross-architecture protection.
          p = Path('test/update_service_test.dart')
          s = p.read_text()
          if "beta OTA never crosses Windows architectures" not in s:
              marker = "  test('only Flutter is the beta branch', () {"
              tests = """  test('beta OTA never crosses Windows architectures', () {
    const x64Asset = 'LocalStoreManagement-0.1.6-b11-BETA-Setup-win-x64.exe';
    const arm64Asset = 'LocalStoreManagement-0.1.6-b11-BETA-Setup-win-arm64.exe';
    expect(updateAssetMatchesFor(assetName: x64Asset, operatingSystem: 'windows', abi: Abi.windowsX64, beta: true), isTrue);
    expect(updateAssetMatchesFor(assetName: arm64Asset, operatingSystem: 'windows', abi: Abi.windowsX64, beta: true), isFalse);
    expect(updateAssetMatchesFor(assetName: x64Asset, operatingSystem: 'windows', abi: Abi.windowsArm64, beta: true), isFalse);
  });

  test('beta OTA never crosses macOS Intel and Apple Silicon', () {
    const x64Asset = 'LocalStoreManagement-0.1.6-b11-BETA-macos-x64.dmg';
    const arm64Asset = 'LocalStoreManagement-0.1.6-b11-BETA-macos-arm64.dmg';
    expect(updateAssetMatchesFor(assetName: x64Asset, operatingSystem: 'macos', abi: Abi.macosX64, beta: true), isTrue);
    expect(updateAssetMatchesFor(assetName: arm64Asset, operatingSystem: 'macos', abi: Abi.macosX64, beta: true), isFalse);
    expect(updateAssetMatchesFor(assetName: arm64Asset, operatingSystem: 'macos', abi: Abi.macosArm64, beta: true), isTrue);
    expect(updateAssetMatchesFor(assetName: x64Asset, operatingSystem: 'macos', abi: Abi.macosArm64, beta: true), isFalse);
  });

"""
              if marker not in s:
                  raise SystemExit('OTA test anchor not found')
              s = s.replace(marker, tests + marker, 1)
          p.write_text(s)

          # Formula tests.
          Path('test/price_formula_test.dart').write_text("""import 'package:flutter_test/flutter_test.dart';
import 'package:local_store_management/core/formatters.dart';

void main() {
  test('purchase price formula applies percentage discount', () {
    expect(parsePriceFormulaCents('200-40%'), 12000);
    expect(parsePriceFormulaCents('200,00 - 40%'), 12000);
  });

  test('purchase price formula supports chained percentages', () {
    expect(parsePriceFormulaCents('200-40%-10%'), 10800);
    expect(parsePriceFormulaCents('100+20%'), 12000);
  });

  test('purchase price formula honors multiplication precedence', () {
    expect(parsePriceFormulaCents('10+5*2'), 2000);
    expect(parsePriceFormulaCents('100/4'), 2500);
  });

  test('purchase price formula rejects invalid expressions', () {
    expect(() => parsePriceFormulaCents('200-abc'), throwsFormatException);
    expect(() => parsePriceFormulaCents('100/0'), throwsFormatException);
  });
}
""")

          # Bump beta.
          p = Path('pubspec.yaml')
          s = p.read_text().replace('version: 0.1.6-b10', 'version: 0.1.6-b11', 1)
          if 'version: 0.1.6-b11' not in s:
              raise SystemExit('pubspec beta bump failed')
          p.write_text(s)
          PY

      - name: Commit final changes and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .apply-export-ota-price .github/workflows/apply-export-ota-price.yml
          git config user.name 'MaydayAlaska'
          git config user.email '43659965+MaydayAlaska@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: improve export pricing OTA and purchase formulas'
          git push origin HEAD:Flutter
