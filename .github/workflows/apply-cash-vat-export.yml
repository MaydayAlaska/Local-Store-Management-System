          page = replace_once(
              page,
              """    _shopName = TextEditingController(text: widget.current.shopName);
    _showName = widget.current.showShopNameInMenu;
""",
              """    _shopName = TextEditingController(text: widget.current.shopName);
    _vatPercent = TextEditingController(
      text: _formatPercent(widget.current.vatPercent),
    );
    _showName = widget.current.showShopNameInMenu;
""",
              'Init VAT impostazioni',
          )
          page = replace_once(
              page,
              """  String _itEn(String it, String en) => AppStrings.isEnglish ? en : it;

  @override
""",
              """  String _itEn(String it, String en) => AppStrings.isEnglish ? en : it;

  String _formatPercent(double value) =>
      value.toStringAsFixed(2).replaceFirst(RegExp(r'\\.?0+$'), '');

  @override
""",
              'Formatter VAT impostazioni',
          )
          page = replace_once(
              page,
              """    _shopName.dispose();
    super.dispose();
""",
              """    _shopName.dispose();
    _vatPercent.dispose();
    super.dispose();
""",
              'Dispose VAT impostazioni',
          )
          page = replace_once(
