name: local_store_management
description: Gestionale desktop offline per negozio, riscritto in Flutter.
publish_to: none
version: 0.2.0-b5

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  sqlite3: ^3.1.1
  file_selector: ^1.0.4
  window_manager: ^0.5.1
  printing: 5.15.0
  pdf: ^3.13.0
  image: ^4.9.0
  excel_plus: ^2.14.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/translations/
    - assets/app-icon.base64
