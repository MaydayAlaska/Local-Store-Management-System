name: One-shot cart tooltip b3 fix

on:
  push:
    branches: [Flutter]
    paths:
      - '.github/workflows/one-shot-cart-tooltip-b3.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: Flutter
          fetch-depth: 0

      - name: Apply tooltip fix and beta bump
        shell: python
        run: |
          from pathlib import Path

          cash_path = Path('lib/pages/cash_page.dart')
          text = cash_path.read_text(encoding='utf-8')
          start = text.index('class _CartTileState extends State<_CartTile> {')
          end = text.index('class _CashLine {', start)

          replacement = r'''class _CartTileState extends State<_CartTile> {
  final GlobalKey _articleKey = GlobalKey();
  OverlayEntry? _previewOverlay;

  void _showPreview() {
    final bytes = widget.imageBytes;
    if (bytes == null || _previewOverlay != null || !mounted) return;

    final overlay = Overlay.of(context, rootOverlay: true);
    final targetBox =
        _articleKey.currentContext?.findRenderObject() as RenderBox?;
    final overlayBox = overlay.context.findRenderObject() as RenderBox?;
    if (targetBox == null || overlayBox == null) return;

    final targetTopLeft =
        targetBox.localToGlobal(Offset.zero, ancestor: overlayBox);
    const previewBodySize = 190.0;
    const arrowWidth = 12.0;
    const previewWidth = previewBodySize + arrowWidth;
    const previewHeight = previewBodySize;
    const gap = 10.0;
    const edgePadding = 8.0;

    final showLeft = targetTopLeft.dx >= previewWidth + gap + edgePadding;
    final rawLeft = showLeft
        ? targetTopLeft.dx - previewWidth - gap
        : targetTopLeft.dx + targetBox.size.width + gap;
    final maxLeft = overlayBox.size.width - previewWidth - edgePadding;
    final left = rawLeft.clamp(edgePadding, maxLeft).toDouble();

    final rawTop = targetTopLeft.dy +
        (targetBox.size.height / 2) -
        (previewHeight / 2);
    final maxTop = overlayBox.size.height - previewHeight - edgePadding;
    final top = rawTop.clamp(edgePadding, maxTop).toDouble();

    final entry = OverlayEntry(
      builder: (overlayContext) => Positioned(
        left: left,
        top: top,
        child: IgnorePointer(
          child: Material(
            type: MaterialType.transparency,
            child: _CartImageHoverPreview(
              imageBytes: bytes,
              arrowOnRight: showLeft,
            ),
          ),
        ),
      ),
    );
    _previewOverlay = entry;
    overlay.insert(entry);
  }

  void _hidePreview() {
    _previewOverlay?.remove();
    _previewOverlay = null;
  }

  Future<void> _showLargeImage() async {
    final bytes = widget.imageBytes;
    if (bytes == null) return;
    _hidePreview();
    await showDialog<void>(
      context: context,
      builder: (dialogContext) {
        final size = MediaQuery.sizeOf(dialogContext);
        return AlertDialog(
          title: Text(widget.line.cartTitle),
          content: ConstrainedBox(
            constraints: BoxConstraints(
              maxWidth: size.width * 0.72,
              maxHeight: size.height * 0.72,
            ),
            child: InteractiveViewer(
              minScale: 0.5,
              maxScale: 4,
              child: Image.memory(
                bytes,
                fit: BoxFit.contain,
                gaplessPlayback: true,
              ),
            ),
          ),
          actions: [
            TextButton.icon(
              onPressed: () => Navigator.of(dialogContext).pop(),
              icon: const Icon(Icons.close),
              label: Text(AppStrings.pair('Chiudi', 'Close')),
            ),
          ],
        );
      },
    );
  }

  @override
  void didUpdateWidget(covariant _CartTile oldWidget) {
    super.didUpdateWidget(oldWidget);
    if (oldWidget.imageBytes != widget.imageBytes) _hidePreview();
  }

  @override
  void dispose() {
    _hidePreview();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    final line = widget.line;
    final bytes = widget.imageBytes;
    final theme = Theme.of(context);
    final articleDetails = IntrinsicWidth(
      child: Column(
        mainAxisSize: MainAxisSize.min,
        crossAxisAlignment: CrossAxisAlignment.start,
        children: [
          Text(
            line.cartTitle,
            style: theme.textTheme.titleSmall?.copyWith(
              fontWeight: FontWeight.w700,
            ),
          ),
          Text(line.cartSubtitle),
        ],
      ),
    );

    return Padding(
      padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
      child: Row(children: [
        Flexible(
          fit: FlexFit.loose,
          child: MouseRegion(
            key: _articleKey,
            cursor: bytes == null
                ? MouseCursor.defer
                : SystemMouseCursors.click,
            onEnter: bytes == null ? null : (_) => _showPreview(),
            onExit: bytes == null ? null : (_) => _hidePreview(),
            child: GestureDetector(
              behavior: HitTestBehavior.opaque,
              onTap: bytes == null ? null : _showLargeImage,
              child: articleDetails,
            ),
          ),
        ),
        const Spacer(),
        IconButton(
          onPressed: line.isGiftCardPurchase ? null : widget.onDecrease,
          icon: const Icon(Icons.remove_circle_outline),
        ),
        Text('${line.quantity}'),
        IconButton(
          onPressed: line.isGiftCardPurchase ? null : widget.onIncrease,
          icon: const Icon(Icons.add_circle_outline),
        ),
        SizedBox(
          width: 84,
          child: TextFormField(
            key: ValueKey('${line.key}-${line.discountPercent}'),
            initialValue: line.discountPercent == 0
                ? ''
                : line.discountPercent.toString().replaceAll('.', ','),
            enabled: !line.isGiftCardPurchase,
            keyboardType:
                const TextInputType.numberWithOptions(decimal: true),
            onFieldSubmitted: widget.onDiscount,
            decoration: InputDecoration(
              isDense: true,
              labelText: AppStrings.isEnglish ? 'Discount' : 'Sconto',
              floatingLabelBehavior: FloatingLabelBehavior.always,
              suffixText: '%',
            ),
          ),
        ),
        const SizedBox(width: 10),
        SizedBox(
          width: 88,
          child: Text(
            formatMoney(line.lineTotalCents),
            textAlign: TextAlign.right,
          ),
        ),
        IconButton(
          onPressed: widget.onRemove,
          tooltip: AppStrings.t('remove'),
          icon: const Icon(Icons.close),
        ),
      ]),
    );
  }
}

class _CartImageHoverPreview extends StatelessWidget {
  const _CartImageHoverPreview({
    required this.imageBytes,
    required this.arrowOnRight,
  });

  final Uint8List imageBytes;
  final bool arrowOnRight;

  @override
  Widget build(BuildContext context) {
    final theme = Theme.of(context);
    final isDark = theme.brightness == Brightness.dark;
    final background = theme.canvasColor;
    final border = isDark
        ? const Color(0x38FFFFFF)
        : const Color(0xA8FFFFFF);
    final shadow = Colors.black.withValues(alpha: isDark ? 0.42 : 0.18);

    final body = Container(
      width: 190,
      height: 190,
      padding: const EdgeInsets.all(8),
      decoration: BoxDecoration(
        color: background,
        borderRadius: BorderRadius.circular(20),
        border: Border.all(color: border),
        boxShadow: [
          BoxShadow(
            color: shadow,
            blurRadius: 18,
            offset: const Offset(0, 6),
          ),
        ],
      ),
      child: ClipRRect(
        borderRadius: BorderRadius.circular(14),
        child: ColoredBox(
          color: theme.colorScheme.surfaceContainerHighest
              .withValues(alpha: isDark ? 0.34 : 0.46),
          child: Image.memory(
            imageBytes,
            fit: BoxFit.contain,
            gaplessPlayback: true,
          ),
        ),
      ),
    );

    final arrow = CustomPaint(
      size: const Size(12, 28),
      painter: _CartPreviewArrowPainter(
        fillColor: background,
        borderColor: border,
        shadowColor: shadow,
        pointsRight: arrowOnRight,
      ),
    );

    return Row(
      mainAxisSize: MainAxisSize.min,
      children: arrowOnRight ? [body, arrow] : [arrow, body],
    );
  }
}

class _CartPreviewArrowPainter extends CustomPainter {
  const _CartPreviewArrowPainter({
    required this.fillColor,
    required this.borderColor,
    required this.shadowColor,
    required this.pointsRight,
  });

  final Color fillColor;
  final Color borderColor;
  final Color shadowColor;
  final bool pointsRight;

  @override
  void paint(Canvas canvas, Size size) {
    final path = Path();
    if (pointsRight) {
      path
        ..moveTo(0, 0)
        ..lineTo(size.width, size.height / 2)
        ..lineTo(0, size.height);
    } else {
      path
        ..moveTo(size.width, 0)
        ..lineTo(0, size.height / 2)
        ..lineTo(size.width, size.height);
    }
    path.close();

    canvas.drawShadow(path, shadowColor, 5, true);
    canvas.drawPath(path, Paint()..color = fillColor);
    canvas.drawPath(
      path,
      Paint()
        ..color = borderColor
        ..style = PaintingStyle.stroke
        ..strokeWidth = 1,
    );
  }

  @override
  bool shouldRepaint(covariant _CartPreviewArrowPainter oldDelegate) =>
      fillColor != oldDelegate.fillColor ||
      borderColor != oldDelegate.borderColor ||
      shadowColor != oldDelegate.shadowColor ||
      pointsRight != oldDelegate.pointsRight;
}

'''

          cash_path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          ptext = pubspec.read_text(encoding='utf-8')
          if 'version: 0.2.0-b2' not in ptext:
              raise SystemExit('Expected pubspec version 0.2.0-b2')
          pubspec.write_text(ptext.replace('version: 0.2.0-b2', 'version: 0.2.0-b3', 1), encoding='utf-8')

          update = Path('lib/services/update_service.dart')
          utext = update.read_text(encoding='utf-8')
          old = "static const currentVersion = '0.2.0-b2';"
          new = "static const currentVersion = '0.2.0-b3';"
          if old not in utext:
              raise SystemExit('Expected OTA version 0.2.0-b2')
          update.write_text(utext.replace(old, new, 1), encoding='utf-8')

      - name: Format changed Dart file
        run: dart format lib/pages/cash_page.dart

      - name: Validate patch
        run: |
          git diff --check
          grep -q '^version: 0.2.0-b3$' pubspec.yaml
          grep -q "currentVersion = '0.2.0-b3'" lib/services/update_service.dart
          grep -q 'final GlobalKey _articleKey' lib/pages/cash_page.dart

      - name: Commit application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/cash_page.dart lib/services/update_service.dart pubspec.yaml
          git commit -m "Fix cart tooltip preview and bump beta to 0.2.0-b3"
          git push origin HEAD:Flutter
