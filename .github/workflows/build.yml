name: Build desktop app

on:
  push:
    branches:
      - test
      - main
  pull_request:
    branches:
      - test
      - main

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/LocalStoreManagement.Desktop/LocalStoreManagement.Desktop.csproj

      - name: Build
        run: dotnet build src/LocalStoreManagement.Desktop/LocalStoreManagement.Desktop.csproj --configuration Release --no-restore
