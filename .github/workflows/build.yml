name: Build and package Flutter desktop app

on:
  push:
    branches: [Flutter, test, main]
  pull_request:
    branches: [Flutter, test, main]

concurrency:
  group: flutter-build-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ICON_BASE64: assets/app-icon.base64

jobs:
  verify:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux desktop dependencies
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 \
            -o Dpkg::Use-Pty=0 \
            install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Linux runner
        run: |
          flutter create --platforms=linux --project-name local_store_management --org com.maydayalaska .
          rm -f test/widget_test.dart

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: SQLite smoke test
        run: flutter test

  package-windows:
    name: Windows installer (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            build_arch: x64
            allowed_architectures: x64compatible
          - runner: windows-11-vs2026-arm
            arch: arm64
            build_arch: arm64
            allowed_architectures: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter x64 host SDK
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          cache: true

      - name: Setup Flutter x64 host SDK for Windows ARM64
        if: matrix.arch == 'arm64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          cache: false

      - name: Show Flutter and host architecture
        shell: pwsh
        run: |
          flutter --version
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "PROCESSOR_ARCHITEW6432=$env:PROCESSOR_ARCHITEW6432"

      - name: Force Flutter Windows ARM64 host detection
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $source = Join-Path $env:FLUTTER_ROOT 'packages/flutter_tools/lib/src/base/os.dart'
          $text = Get-Content -Raw $source
          $pattern = '(?s)HostPlatform get hostPlatform \{\s*return switch \(_currentAbi\) \{.*?\n\s*\};\s*\n\s*\}'
          $matches = [regex]::Matches($text, $pattern)
          if ($matches.Count -ne 1) {
            throw "Impossibile applicare il workaround Windows ARM64: trovati $($matches.Count) getter hostPlatform compatibili."
          }
          $replacement = "HostPlatform get hostPlatform {`n    return HostPlatform.windows_arm64;`n  }"
          $patched = [regex]::Replace($text, $pattern, $replacement, 1)
          [IO.File]::WriteAllText($source, $patched)

          Remove-Item (Join-Path $env:FLUTTER_ROOT 'bin/cache/flutter_tools.snapshot') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:FLUTTER_ROOT 'bin/cache/flutter_tools.stamp') -Force -ErrorAction SilentlyContinue

          flutter --version
          flutter precache --windows --force

      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name local_store_management --org com.maydayalaska .

      - name: Prepare Windows application icon
        shell: pwsh
        run: |
          $png = [Convert]::FromBase64String((Get-Content -Raw "${{ env.ICON_BASE64 }}").Trim())
          $iconPath = "windows/runner/resources/app_icon.ico"
          $stream = [IO.File]::Open($iconPath, [IO.FileMode]::Create, [IO.FileAccess]::Write)
          try {
            $writer = [IO.BinaryWriter]::new($stream)
            $writer.Write([UInt16]0); $writer.Write([UInt16]1); $writer.Write([UInt16]1)
            $writer.Write([Byte]64); $writer.Write([Byte]64); $writer.Write([Byte]0); $writer.Write([Byte]0)
            $writer.Write([UInt16]1); $writer.Write([UInt16]32)
            $writer.Write([UInt32]$png.Length); $writer.Write([UInt32]22); $writer.Write($png); $writer.Flush()
          } finally { $stream.Dispose() }

      - name: Resolve packages
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          $commit = if ("${{ github.event.pull_request.head.sha }}") { "${{ github.event.pull_request.head.sha }}" } else { "${{ github.sha }}" }
          $branch = if ("${{ github.head_ref }}") { "${{ github.head_ref }}" } else { "${{ github.ref_name }}" }
          flutter build windows --release --dart-define="GIT_COMMIT=$commit" --dart-define="BUILD_BRANCH=$branch"

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $rawVersion = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1).Matches.Groups[1].Value)
          $version = $rawVersion -replace '\+', '.'
          $publishDir = (Resolve-Path 'build/windows/${{ matrix.build_arch }}/runner/Release').Path
          $outputDir = (Resolve-Path 'dist').Path
          $iconFile = (Resolve-Path 'windows/runner/resources/app_icon.ico').Path
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)
          if (-not $iscc) {
            $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup *\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw 'ISCC.exe (Inno Setup) non trovato nel runner Windows.' }
          & $iscc "/DPublishDir=$publishDir" "/DOutputDir=$outputDir" "/DAppVersion=$version" "/DIconFile=$iconFile" "/DAllowedArchitectures=${{ matrix.allowed_architectures }}" "/DOutputBaseFilename=LocalStoreManagement-Setup-win-${{ matrix.arch }}" 'packaging/windows/installer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer for release jobs
        uses: actions/upload-artifact@v4
        with:
          name: package-win-${{ matrix.arch }}
          path: dist/LocalStoreManagement-Setup-win-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 1

  package-linux:
    name: Linux packages (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
            build_arch: x64
            deb_arch: amd64
            appimage_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            build_arch: arm64
            deb_arch: arm64
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux desktop dependencies
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 \
            -o Dpkg::Use-Pty=0 \
            install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            squashfs-tools curl git unzip xz-utils

      - name: Setup Flutter x64
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64
          cache: true

      - name: Bootstrap Flutter ARM64 from official stable branch
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_ROOT="$RUNNER_TEMP/flutter-arm64"
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          "$FLUTTER_ROOT/bin/flutter" --version
          "$FLUTTER_ROOT/bin/flutter" config --enable-linux-desktop
          "$FLUTTER_ROOT/bin/flutter" precache --linux

      - name: Show Flutter and host architecture
        shell: bash
        run: |
          uname -m
          flutter --version

      - name: Generate Linux runner
        run: flutter create --platforms=linux --project-name local_store_management --org com.maydayalaska .

      - name: Resolve packages
        run: flutter pub get

      - name: Build Linux release
        shell: bash
        run: |
          set -euo pipefail
          COMMIT='${{ github.event.pull_request.head.sha }}'
          if [ -z "$COMMIT" ]; then COMMIT='${{ github.sha }}'; fi
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          flutter build linux --release --dart-define="GIT_COMMIT=$COMMIT" --dart-define="BUILD_BRANCH=$BRANCH"

      - name: Build AppDir
        shell: bash
        run: |
          set -euo pipefail
          rm -rf AppDir dist
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/64x64/apps dist
          cp -a build/linux/${{ matrix.build_arch }}/release/bundle/. AppDir/usr/bin/
          cp packaging/linux/AppRun AppDir/AppRun
          cp packaging/linux/local-store-management.desktop AppDir/local-store-management.desktop
          base64 --decode "${ICON_BASE64}" > AppDir/local-store-management.png
          cp AppDir/local-store-management.png AppDir/usr/share/icons/hicolor/64x64/apps/local-store-management.png
          ln -s local-store-management.png AppDir/.DirIcon
          chmod +x AppDir/AppRun AppDir/usr/bin/local_store_management

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          TOOL="appimagetool-${{ matrix.appimage_arch }}.AppImage"
          curl --fail --location --retry 3 --output "$TOOL" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/$TOOL"
          chmod +x "$TOOL"
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=${{ matrix.appimage_arch }} ./"$TOOL" AppDir dist/LocalStoreManagement-linux-${{ matrix.arch }}.AppImage
          chmod +x dist/LocalStoreManagement-linux-${{ matrix.arch }}.AppImage

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail
          RAW_VERSION="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          DEB_VERSION="${RAW_VERSION/+/.}"
          rm -rf DebRoot
          mkdir -p DebRoot/DEBIAN \
                   DebRoot/usr/bin \
                   DebRoot/usr/lib/local-store-management \
                   DebRoot/usr/share/applications \
                   DebRoot/usr/share/icons/hicolor/64x64/apps
          cp -a build/linux/${{ matrix.build_arch }}/release/bundle/. DebRoot/usr/lib/local-store-management/
          cp packaging/linux/local-store-management.desktop DebRoot/usr/share/applications/local-store-management.desktop
          base64 --decode "${ICON_BASE64}" > DebRoot/usr/share/icons/hicolor/64x64/apps/local-store-management.png
          cat > DebRoot/usr/bin/local_store_management <<'EOF'
          #!/bin/sh
          exec /usr/lib/local-store-management/local_store_management "$@"
          EOF
          chmod +x DebRoot/usr/bin/local_store_management DebRoot/usr/lib/local-store-management/local_store_management
          INSTALLED_SIZE="$(du -sk DebRoot/usr | cut -f1)"
          cat > DebRoot/DEBIAN/control <<EOF
          Package: local-store-management-system
          Version: ${DEB_VERSION}
          Section: office
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: MaydayAlaska
          Depends: libgtk-3-0, libblkid1, liblzma5
          Installed-Size: ${INSTALLED_SIZE}
          Description: Local Store Management System
           Gestionale desktop offline per negozio.
          EOF
          dpkg-deb --build --root-owner-group DebRoot dist/LocalStoreManagement-linux-${{ matrix.arch }}.deb

      - name: Upload Linux packages for release jobs
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-${{ matrix.arch }}
          path: |
            dist/LocalStoreManagement-linux-${{ matrix.arch }}.AppImage
            dist/LocalStoreManagement-linux-${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 1

  release-flutter:
    name: Publish Flutter development assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/Flutter'
    needs: [package-windows, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Publish direct development downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='flutter-latest'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Flutter development build (${GITHUB_SHA::7})" \
            --notes 'Build di sviluppo del branch Flutter. Scarica direttamente il file adatto al sistema: EXE per Windows, AppImage o DEB per Linux. Gli artifact Actions sono solo trasferimenti interni temporanei.'

  release-test:
    name: Publish test beta assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    needs: [package-windows, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Publish beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RAW_VERSION="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          VERSION="${RAW_VERSION/+/.}"
          TAG='test-latest'
          mv dist/LocalStoreManagement-Setup-win-x64.exe "dist/LocalStoreManagement-${VERSION}-BETA-Setup-win-x64.exe"
          mv dist/LocalStoreManagement-Setup-win-arm64.exe "dist/LocalStoreManagement-${VERSION}-BETA-Setup-win-arm64.exe"
          mv dist/LocalStoreManagement-linux-x64.AppImage "dist/LocalStoreManagement-${VERSION}-BETA-linux-x64.AppImage"
          mv dist/LocalStoreManagement-linux-x64.deb "dist/LocalStoreManagement-${VERSION}-BETA-linux-x64.deb"
          mv dist/LocalStoreManagement-linux-arm64.AppImage "dist/LocalStoreManagement-${VERSION}-BETA-linux-arm64.AppImage"
          mv dist/LocalStoreManagement-linux-arm64.deb "dist/LocalStoreManagement-${VERSION}-BETA-linux-arm64.deb"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Local Store Management v${VERSION} BETA / TEST (${GITHUB_SHA::7})" \
            --notes 'Versione BETA/TEST generata automaticamente dal branch test. Include Windows x64/ARM64 e Linux x64/ARM64 in formato AppImage e DEB.'

  release-main:
    name: Publish main release assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [package-windows, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Publish stable release and OTA bridge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RAW_VERSION="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          VERSION="${RAW_VERSION/+/.}"
          STABLE_TAG="v${VERSION}"
          LEGACY_TAG="ota-${GITHUB_SHA}"
          while IFS= read -r old_tag; do
            [ -z "$old_tag" ] && continue
            gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,name --jq '.[] | select(.name | startswith("Legacy OTA bridge")) | .tagName')
          if gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          if gh release view "$LEGACY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$LEGACY_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh release create "$LEGACY_TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Legacy OTA bridge v${VERSION}" \
            --notes 'Release tecnica per gli aggiornamenti automatici.'
          mkdir stable-dist
          cp dist/LocalStoreManagement-Setup-win-x64.exe "stable-dist/LocalStoreManagement-${VERSION}-Setup-win-x64.exe"
          cp dist/LocalStoreManagement-Setup-win-arm64.exe "stable-dist/LocalStoreManagement-${VERSION}-Setup-win-arm64.exe"
          cp dist/LocalStoreManagement-linux-x64.AppImage "stable-dist/LocalStoreManagement-${VERSION}-linux-x64.AppImage"
          cp dist/LocalStoreManagement-linux-x64.deb "stable-dist/LocalStoreManagement-${VERSION}-linux-x64.deb"
          cp dist/LocalStoreManagement-linux-arm64.AppImage "stable-dist/LocalStoreManagement-${VERSION}-linux-arm64.AppImage"
          cp dist/LocalStoreManagement-linux-arm64.deb "stable-dist/LocalStoreManagement-${VERSION}-linux-arm64.deb"
          gh release create "$STABLE_TAG" stable-dist/* --repo "$GITHUB_REPOSITORY" --latest=true \
            --title "Local Store Management v${VERSION}" \
            --notes "Release stabile v${VERSION}. Windows x64/ARM64 e Linux x64/ARM64 (AppImage + DEB)."
