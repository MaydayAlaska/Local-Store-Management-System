name: Update ANPR birth place dataset

on:
  push:
    branches: [Flutter, main]
    paths:
      - tool/update_birth_places.py
      - tool/ensure_anpr_build_guard.py
      - .github/workflows/update-birth-places.yml
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Refresh official ANPR dataset (${{ matrix.branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [Flutter, main]
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', matrix.branch)
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Generate and validate dataset
        run: python3 tool/update_birth_places.py

      - name: Ensure every build verifies ANPR freshness
        run: python3 tool/ensure_anpr_build_guard.py

      - name: Commit only when ANPR data or guard changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/data/birth_places.json assets/data/birth_places_manifest.json .github/workflows/build.yml; then
            echo "Archivio ANPR e controllo build invariati su ${{ matrix.branch }}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/birth_places.json assets/data/birth_places_manifest.json .github/workflows/build.yml
          git commit -m "ci: refresh ANPR data and build guard"
          git pull --rebase origin "${{ matrix.branch }}"
          git push origin "HEAD:${{ matrix.branch }}"
