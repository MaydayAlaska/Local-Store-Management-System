name: Apply cash VAT and export update

on:
  push:
    branches: [Flutter]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest Flutter branch
        uses: actions/checkout@v7
        with:
          ref: Flutter
          fetch-depth: 0

      - name: Fast-forward to latest branch state
        shell: bash
        run: git pull --ff-only origin Flutter

      - name: Apply requested changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: attesa 1 occorrenza, trovate {count}. Nessuna modifica applicata.')
              return text.replace(old, new, 1)

          # --- Cassa: elenco a tutta altezza, pannello destro largo come il tastierino,
          # VAT sotto al totale e rimozione del titolo del tastierino.
          cash_path = Path('lib/pages/cash_page.dart')
          cash = cash_path.read_text()

          cash = replace_once(
              cash,
              """                    SizedBox(
                      height: 188,
                      child: Card(
""",
              """                    Expanded(
                      child: Card(
""",
