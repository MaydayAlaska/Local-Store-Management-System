name: One-shot adjust cash keypad

on:
  push:
    branches: [chatgpt-keypad-layout-20260819]
    paths:
      - .github/workflows/one-shot-adjust-cash-keypad.yml
  pull_request:
    branches: [Flutter]
    paths:
      - .github/workflows/one-shot-adjust-cash-keypad.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt-keypad-layout-20260819
          fetch-depth: 0

      - name: Apply keypad layout patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/pages/cash_page.dart')
          text = path.read_text()

          old_layout = """                    Expanded(
                      child: _CashKeypad(
                        priceText: formatMoney(_keypadPriceCents),
                        onKey: _keypadInsert,
                        onBackspace: _keypadBackspace,
                        onClear: _keypadClear,
                        onSubmit: _keypadSubmit,
                      ),
                    ),
"""
          new_layout = """                    Expanded(
                      child: LayoutBuilder(
                        builder: (context, constraints) {
                          final keypadWidth = constraints.maxWidth > 500
                              ? 500.0
                              : constraints.maxWidth;
                          final keypadHeight = constraints.maxHeight > 470
                              ? 470.0
                              : constraints.maxHeight;
                          return Align(
                            alignment: Alignment.topCenter,
                            child: SizedBox(
                              width: keypadWidth,
                              height: keypadHeight,
                              child: _CashKeypad(
                                priceText: formatMoney(_keypadPriceCents),
                                onKey: _keypadInsert,
                                onBackspace: _keypadBackspace,
                                onClear: _keypadClear,
                                onSubmit: _keypadSubmit,
                              ),
                            ),
                          );
                        },
                      ),
                    ),
"""
          if old_layout not in text:
              raise SystemExit('Keypad placement block not found; aborting without changes.')
          text = text.replace(old_layout, new_layout, 1)

          old_button = """  Widget _numberButton(String value, {int flex = 1}) => Expanded(
        flex: flex,
        child: SizedBox.expand(
          child: OutlinedButton(
            onPressed: () => onKey(value),
            child: Text(value),
          ),
        ),
      );
"""
          new_button = """  Widget _numberButton(String value, {int flex = 1}) => Expanded(
        flex: flex,
        child: SizedBox.expand(
          child: OutlinedButton(
            onPressed: () => onKey(value),
            child: Text(
              value,
              style: const TextStyle(
                fontSize: 20,
                fontWeight: FontWeight.w600,
              ),
            ),
          ),
        ),
      );
"""
          if old_button not in text:
              raise SystemExit('Keypad number button block not found; aborting without changes.')
          text = text.replace(old_button, new_button, 1)

          old_action_width = """                    SizedBox(
                      width: 54,
                      child: Column(
"""
          new_action_width = """                    SizedBox(
                      width: 64,
                      child: Column(
"""
          if old_action_width not in text:
              raise SystemExit('Keypad action column block not found; aborting without changes.')
          text = text.replace(old_action_width, new_action_width, 1)

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-adjust-cash-keypad.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/cash_page.dart .github/workflows/one-shot-adjust-cash-keypad.yml
          git commit -m "ui: rebalance cash keypad proportions"
          git push origin HEAD:chatgpt-keypad-layout-20260819
